name: verify

on:
  push:
  pull_request:

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 题库 JSON Schema 校验（P1-2）
        run: python 00_工具/validate_banks.py
      - name: 内容 JSON 有效性校验（P3-1）
        run: python 00_工具/validate_content.py
